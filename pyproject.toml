[project]
name = "arthur-mask"
version = "0.1.0"
description = "Arthur Mask: Türk hukuk belgeleri (UDF/DOCX/PDF) için yerel takma adlandırma"
requires-python = ">=3.10"
license = { text = "LicenseRef-ArthurLegal-Proprietary-Non-Commercial" }
dependencies = [
    "presidio-analyzer>=2.2.364",
    "spacy>=3.7",
    "pyyaml>=6",
    "cryptography>=42",
    "pypdf>=5",
]

[project.optional-dependencies]
test = ["pytest>=8", "python-docx>=1.1", "reportlab>=4"]

[project.scripts]
arthur-mask = "arthur_mask.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["arthur_mask*"]

[tool.setuptools.package-data]
arthur_mask = ["veri/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
